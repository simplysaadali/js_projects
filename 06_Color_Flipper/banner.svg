<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="swatch1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5F6D"/>
      <stop offset="100%" stop-color="#FFC371"/>
    </linearGradient>
    <linearGradient id="swatch2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="swatch3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="swatch4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C33764"/>
      <stop offset="100%" stop-color="#1D2671"/>
    </linearGradient>
    <linearGradient id="swatch5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- color swatches strip -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#swatch1)"/>
  <rect x="0" y="290" width="1200" height="10" fill="url(#swatch2)"/>

  <!-- floating color chips -->
  <rect x="80" y="60" width="70" height="70" rx="16" fill="url(#swatch1)" transform="rotate(-8 115 95)"/>
  <rect x="1050" y="55" width="70" height="70" rx="16" fill="url(#swatch3)" transform="rotate(10 1085 90)"/>
  <rect x="150" y="200" width="55" height="55" rx="14" fill="url(#swatch4)" transform="rotate(14 177 227)"/>
  <rect x="990" y="190" width="55" height="55" rx="14" fill="url(#swatch5)" transform="rotate(-12 1017 217)"/>
  <rect x="60" y="185" width="40" height="40" rx="10" fill="url(#swatch2)" transform="rotate(6 80 205)"/>
  <rect x="1085" y="175" width="42" height="42" rx="10" fill="url(#swatch1)" transform="rotate(-6 1106 196)"/>

  <!-- title -->
  <text x="600" y="150" font-family="Verdana, Geneva, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">🎨 Color Flipper</text>
  <text x="600" y="195" font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#cfcfcf" text-anchor="middle">A tiny, dependency-free background color randomizer</text>
</svg>
