<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color-hex Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="color-box"></div>
        <div id="hex-code">#00800</div>

        <div class="buttons">
            <button id="generate-btn" onclick="generateHex()">Generate</button>
            <button id="copy-btn" onclick="copyHex()">Copy</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
